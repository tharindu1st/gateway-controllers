name: oauth2-session
version: v0.1.0
displayName: OAuth2 Session
description: |
  Logs browser users in with the OAuth 2.0 authorization code grant and
  keeps their tokens on the gateway. The browser only holds an opaque,
  signed session cookie; access and refresh tokens are stored encrypted
  in Redis, refreshed before they expire, and sent to the backend as a
  bearer token. Attach it at API level and declare the login, callback
  and logout paths as GET operations; every other operation requires a
  session.

parameters:
  type: object
  additionalProperties: false
  required:
    - authorizationEndpoint
    - tokenEndpoint
    - clientId
    - clientSecret
    - redirectUri
    - sessionSigningKey
    - tokenEncryptionKey
  properties:
    authorizationEndpoint:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Identity provider authorization endpoint the browser is
        redirected to at login.
    tokenEndpoint:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Identity provider token endpoint used to redeem the
        authorization code and refresh tokens.
    clientId:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: OAuth2 client ID registered for the gateway.
    clientSecret:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Client secret paired with clientId. Use {{ secret "handle" }}.
    redirectUri:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Absolute callback URL registered at the identity provider, for
        example https://gw.example.com/orders/v1/callback. Its path must
        end with callbackPath.
    clientAuthMethod:
      type: string
      x-wso2-policy-advanced-param: false
      description: How client credentials are sent to the token endpoint.
      enum:
        - client_secret_basic
        - client_secret_post
      default: client_secret_basic
    scopes:
      type: array
      x-wso2-policy-advanced-param: false
      items:
        type: string
        minLength: 1
      description: Scopes requested at login.
      default: []
    sessionSigningKey:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 32
      description: |
        Secret used to sign session cookies (HMAC-SHA3-256), at least
        32 bytes. Use {{ secret "handle" }}. Changing it ends every
        session.
    tokenEncryptionKey:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 32
      description: |
        Secret used to encrypt tokens in Redis (AES-256-GCM), at least
        32 bytes. Use {{ secret "handle" }}. Changing it ends every
        session.
    loginPath:
      type: string
      x-wso2-policy-advanced-param: false
      pattern: "^/"
      description: |
        Operation path that starts a login. Declare it as a GET
        operation. Accepts an optional returnTo query parameter holding
        a relative path.
      default: "/login"
    callbackPath:
      type: string
      x-wso2-policy-advanced-param: false
      pattern: "^/"
      description: |
        Operation path the identity provider redirects back to. Declare
        it as a GET operation.
      default: "/callback"
    logoutPath:
      type: string
      x-wso2-policy-advanced-param: false
      pattern: "^/"
      description: Operation path that ends the session. Declare it as a GET operation.
      default: "/logout"
    postLoginRedirect:
      type: string
      x-wso2-policy-advanced-param: false
      pattern: "^/"
      description: |
        Path from the host root where users land after login when no
        valid returnTo is given. Include the API context.
      default: "/"
    postLogoutRedirect:
      type: string
      x-wso2-policy-advanced-param: false
      pattern: "^/"
      description: Path from the host root where users land after logout.
      default: "/"
    idleTimeout:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        A session not used for this long ends (Go duration, e.g. "30m").
      default: "30m"
    absoluteSessionTimeout:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Maximum age of a session regardless of activity (Go duration,
        e.g. "8h"). Also the lifetime of the session cookie.
      default: "8h"
    cookie:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: Session cookie settings.
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Session cookie name. The __Host- prefix (e.g. __Host-X-ABC) is
            recommended: it stops other subdomains from setting the cookie.
          default: "X-ABC"
        stateCookieName:
          type: string
          minLength: 1
          description: Short-lived cookie that ties a login to the browser.
          default: "X-ABC-state"
        sameSite:
          type: string
          description: SameSite attribute of the session cookie.
          enum: ["Lax", "Strict"]
          default: "Lax"
        secure:
          type: boolean
          description: |
            Secure attribute. Disable only for local testing over plain
            HTTP.
          default: true
    authorizationRequestParams:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties:
        type: string
      description: |
        Extra authorization request parameters, such as prompt or
        audience. response_type, client_id, redirect_uri, scope and state
        are set by the policy and cannot be overridden.
    issuer:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Identity provider issuer identifier. When set, each new session is
        indexed by the id_token's sid and sub so the
        oauth2-session-backchannel-logout policy can end it, and an
        id_token from another issuer or audience fails the login. Request
        the openid scope.
      default: ""
    endSessionEndpoint:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Identity provider logout URL. When set, logout also redirects
        there with id_token_hint and post_logout_redirect_uri.
      default: ""
    refreshBuffer:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        How long before expiry the access token is refreshed (Go
        duration, e.g. "5m").
      default: "5m"
    stateTTL:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        How long a started login may take to reach the callback (Go
        duration, e.g. "5m").
      default: "5m"
    defaultTokenTTL:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Access token lifetime assumed when the token response omits
        expires_in (Go duration, e.g. "1h").
      default: "1h"
    upstreamHeaderName:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      description: Header on the backend request that carries the access token.
      default: "Authorization"
    upstreamValuePrefix:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Prefix placed before the access token. Use an empty string for
        no prefix.
      default: "Bearer"
    tokenRequestTimeout:
      type: string
      x-wso2-policy-advanced-param: true
      description: Timeout for a token endpoint call (Go duration, e.g. "10s").
      default: "10s"
    tokenRequestMaxRetries:
      type: integer
      x-wso2-policy-advanced-param: true
      minimum: 0
      description: |
        Retries after a 429 or 5xx from the token endpoint. Network
        errors are not retried, because the code or refresh token may
        already have been used.
      default: 2
    proxyURL:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Proxy URL for token endpoint calls. Defaults to the standard
        HTTP_PROXY/HTTPS_PROXY environment variables.
      default: ""
    tlsCaCert:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        PEM CA certificate to trust for the token endpoint's TLS
        connection. Reference a stored secret, not a raw value.
      default: ""
    tlsInsecureSkipVerify:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Disables TLS certificate verification for the token endpoint.
        Non-production only.
      default: false

systemParameters:
  type: object
  additionalProperties: false
  description: >
    Operator-level Redis settings, not set per API. Resolved from
    config.policy_configurations.oauth2_session_v0.redis.* unless
    overridden here. Redis is required: if it is unreachable, requests
    fail closed.
  properties:
    redis:
      type: object
      additionalProperties: false
      properties:
        host:
          type: string
          description: Redis host name or IP address.
          default: "localhost"
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.host}"

        port:
          type: integer
          description: Redis server port.
          minimum: 1
          maximum: 65535
          default: 6379
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.port}"

        password:
          type: string
          description: Optional Redis authentication password.
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.password}"

        username:
          type: string
          description: Optional Redis ACL username.
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.username}"

        db:
          type: integer
          description: Redis database index.
          minimum: 0
          maximum: 15
          default: 0
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.db}"

        keyPrefix:
          type: string
          description: Prefix used for all Redis keys this policy writes.
          default: "oauth2-session:v1:"
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.key_prefix}"

        connectionTimeout:
          type: string
          description: Redis connection timeout (Go duration, e.g. "5s").
          default: "5s"
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.connection_timeout}"

        readTimeout:
          type: string
          description: Redis read timeout (Go duration, e.g. "3s").
          default: "3s"
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.read_timeout}"

        writeTimeout:
          type: string
          description: Redis write timeout (Go duration, e.g. "3s").
          default: "3s"
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.write_timeout}"

        poolSize:
          type: integer
          description: |
            Redis connection pool size. 0 = go-redis default (10 x
            GOMAXPROCS).
          minimum: 0
          default: 0
          "wso2/defaultValue": "${config.policy_configurations.oauth2_session_v0.redis.pool_size}"
